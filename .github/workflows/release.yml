name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Run tests
        working-directory: src
        run: go test ./...

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # Dynamic binary
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -C src -o "../dist/nam.${VERSION}.linux.amd64"

          # Fully static binary matching the local build script intent
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -C src \
            -ldflags "-extldflags=-static" \
            -o "../dist/nam.${VERSION}.static.linux.amd64"

          cp config.example.yaml "dist/config.example.yaml"

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*