{{ define "components/dashboard-offerings" }}
<div class="grid grid-cols-1 lg:grid-cols-3 xl:grid-cols-5 gap-6">
    {{ range . }}
    <a href="/offerings/{{ .ID }}/details" class="group block rounded-xl shadow-sm hover:shadow-md transition-all duration-200 overflow-hidden ring-1
        {{ if eq .Status "healthy" }}bg-emerald-100 text-slate-900 ring-emerald-200{{ else if eq .Status "problematic" }}bg-amber-100 text-slate-900 ring-amber-200{{ else if eq .Status "down" }}bg-rose-100 text-slate-900 ring-rose-200{{ else }}bg-white text-slate-900 ring-slate-200{{ end }}">
        <div class="px-5 py-5 relative">
            <div class="flex items-start justify-between gap-3">
                <h3 class="text-lg font-semibold leading-tight truncate">{{ .Name }}</h3>
                <span class="text-[11px] uppercase tracking-wide font-semibold
                    {{ if eq .Status "healthy" }}text-emerald-700{{ else if eq .Status "problematic" }}text-amber-700{{ else if eq .Status "down" }}text-rose-700{{ else }}text-slate-600{{ end }}">{{ .Status }}</span>
            </div>

            <div class="mt-3 flex items-center justify-between gap-2">
                <p class="text-sm text-slate-500">{{ .HealthyCount }}/{{ .TotalDefinitions }} healthy</p>
                <span class="relative inline-flex items-center justify-center w-5 h-5 rounded-full bg-slate-100 text-slate-500 text-xs font-semibold cursor-help"
                    title="{{ .ProblematicCount }} problematic, {{ .DownCount }} down, {{ .MaintenanceCount }} maintenance, {{ .NoDataCount }} no-data">
                    i
                </span>
            </div>
        </div>
    </a>
    {{ end }}
</div>

{{ if eq (len .) 0 }}
<div class="text-center py-10 bg-white rounded-lg shadow border border-gray-200">
    <p class="text-sm text-gray-500">No offerings match the selected filters.</p>
</div>
{{ end }}
{{ end }}
